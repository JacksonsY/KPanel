name: Verify published preview

on:
  workflow_call:
    inputs:
      candidate:
        description: "Published preview full source SHA"
        required: true
        type: string
      version:
        description: "Published preview version without v"
        required: true
        type: string
      digest:
        description: "Already published immutable image index sha256 digest"
        required: true
        type: string
      stable-snapshot:
        description: "Frozen before-publication stable and previous-preview JSON"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: "Published preview full source SHA"
        required: true
        type: string
      version:
        description: "Published preview version without v"
        required: true
        type: string
      digest:
        description: "Already published immutable image index sha256 digest"
        required: true
        type: string
      stable-snapshot:
        description: "Frozen before-publication stable and previous-preview JSON"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kpanel-public-verification-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.candidate }}
      IMAGE_DIGEST: ${{ inputs.digest }}
      STABLE_SNAPSHOT: ${{ inputs['stable-snapshot'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen public source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          test "$(git cat-file -t "refs/tags/v$EXPECTED_VERSION")" = tag
          test "$(git rev-parse "refs/tags/v$EXPECTED_VERSION^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Restore frozen publication identity
        run: |
          echo "PUBLIC_EVIDENCE=$RUNNER_TEMP/kpanel-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - run: node scripts/verify-github-public-release.mjs restore-snapshot
      - name: Verify public preview assets and multiarchitecture identity
        run: node scripts/verify-github-public-release.mjs verify

      - name: Verify public preview in real browsers and isolated containers
        run: bash packaging/tests/release-browser/run.sh

      - name: Preserve public acceptance including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kpanel-public-*/**/*.json
            ${{ runner.temp }}/kpanel-real-*/results/**
            ${{ runner.temp }}/kpanel-browser-*/results/**
          if-no-files-found: error
          retention-days: 90
