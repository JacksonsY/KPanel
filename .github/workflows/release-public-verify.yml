name: Verify published release

on:
  workflow_call:
    inputs:
      candidate:
        description: "Published release full source SHA"
        required: true
        type: string
      version:
        description: "Published release version without v"
        required: true
        type: string
      digest:
        description: "Published immutable image index sha256 digest"
        required: true
        type: string
      stable-snapshot:
        description: "Frozen before-publication stable and previous-preview JSON"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: "Published release full source SHA"
        required: true
        type: string
      version:
        description: "Published release version without v"
        required: true
        type: string
      digest:
        description: "Published immutable image index sha256 digest"
        required: true
        type: string
      publication-run-id:
        description: "Original release workflow run ID containing the frozen snapshot artifact"
        required: true
        type: string
      publication-attempt:
        description: "Original release workflow run attempt containing the frozen snapshot artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: kpanel-public-verification-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.candidate }}
      IMAGE_DIGEST: ${{ inputs.digest }}
      STABLE_SNAPSHOT: ${{ inputs['stable-snapshot'] }}
      PUBLICATION_RUN_ID: ${{ inputs['publication-run-id'] }}
      PUBLICATION_ATTEMPT: ${{ inputs['publication-attempt'] }}
      SNAPSHOT_ARTIFACT_DIR: ${{ runner.temp }}/kpanel-publication-snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate frozen public source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$PUBLICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$PUBLICATION_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          test "$(git cat-file -t "refs/tags/v$EXPECTED_VERSION")" = tag
          test "$(git rev-parse "refs/tags/v$EXPECTED_VERSION^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Restore frozen publication identity
        run: |
          echo "PUBLIC_EVIDENCE=$RUNNER_TEMP/kpanel-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download original publication snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: snapshot-${{ inputs['publication-run-id'] }}-${{ inputs['publication-attempt'] }}
          path: ${{ runner.temp }}/kpanel-publication-snapshot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs['publication-run-id'] }}
      - name: Restore frozen publication identity
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            node scripts/verify-github-public-release.mjs restore-artifact
          else
            node scripts/verify-github-public-release.mjs restore-snapshot
          fi
      - name: Verify public release assets and multiarchitecture identity
        run: node scripts/verify-github-public-release.mjs verify

      - name: Bind controller-owned test runner recipe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const { GITHUB_SHA: controller, EXPECTED_SHA: candidate, EXPECTED_VERSION: version,
            GITHUB_RUN_ID: runId, GITHUB_RUN_ATTEMPT: attempt, PUBLIC_EVIDENCE: evidence } = process.env;
          const path = 'packaging/release-runner/Dockerfile';
          const sha = bytes => createHash('sha256').update(bytes).digest('hex');
          if (!/^[a-f0-9]{40}$/.test(controller ?? '') || !/^[a-f0-9]{40}$/.test(candidate ?? '')
            || !/^[1-9][0-9]*$/.test(runId ?? '') || !/^[1-9][0-9]*$/.test(attempt ?? '') || !evidence) {
            throw Error('Invalid frozen test runner identity');
          }
          git('merge-base', '--is-ancestor', controller, 'origin/main');
          if (git('rev-parse', 'HEAD') !== candidate || readFileSync('VERSION', 'utf8').trim() !== version
            || git('status', '--porcelain')) throw Error('Frozen product source must start clean');
          const original = readFileSync(path);
          const recipe = execFileSync('git', ['show', `${controller}:${path}`]);
          writeFileSync(path, recipe);
          const changed = git('diff', '--name-only');
          if (git('rev-parse', 'HEAD') !== candidate || readFileSync('VERSION', 'utf8').trim() !== version
            || (changed !== '' && changed !== path) || git('diff', '--cached', '--name-only')) {
            throw Error('Test runner overlay changed frozen product identity');
          }
          writeFileSync(join(evidence, 'test-runner-recipe.json'), JSON.stringify({
            schemaVersion: 1, candidate, controller, version, runId, attempt, path,
            originalSha256: sha(original), recipeSha256: sha(recipe),
            original: original.toString('utf8'), recipe: recipe.toString('utf8'),
            diff: git('diff', '--', path), productImageUnchanged: true,
          }, null, 2) + '\n', { flag: 'wx' });
          NODE

      - name: Verify public release in real browsers and isolated containers
        run: bash packaging/tests/release-browser/run.sh

      - name: Preserve public acceptance including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kpanel-public-*/**/*.json
            ${{ runner.temp }}/kpanel-real-*/results/**
            ${{ runner.temp }}/kpanel-browser-*/results/**
          if-no-files-found: error
          retention-days: 90
