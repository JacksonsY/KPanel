name: Publish browser component

on:
  push:
    branches: [feature/desktop-browser-chromedp]
    paths:
      - packaging/browser/**
      - cmd/kpanel-browser/**
      - internal/webbrowser/**
      - internal/browserprotocol/**
      - internal/netpolicy/**
      - go.mod
      - go.sum
      - .github/workflows/browser-image.yml
  workflow_dispatch:
    inputs:
      candidate:
        description: Full source commit with successful candidate CI
        required: true
        type: string
      version:
        description: Immutable component version, for example 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-${{ github.event_name == 'workflow_dispatch' && 'publication' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: docker.io/kjlion/kpanel-browser

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.inputs.outputs.candidate }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze approved workflow and candidate
        id: inputs
        env:
          CANDIDATE: ${{ inputs.candidate || github.sha }}
          VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse "$CANDIDATE^{commit}")" = "$CANDIDATE"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [[ "$GITHUB_REF" = refs/heads/main || "$GITHUB_REF" = refs/heads/feature/desktop-browser-chromedp ]]
            echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo 'version=dev' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})(-rc\.([1-9][0-9]{0,5}))?$ ]]
          test "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/browser-image.yml")" = \
               "$(git rev-parse "$CANDIDATE:.github/workflows/browser-image.yml")"
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          test "$count" -gt 0
          for suffix in '' -amd64 -arm64; do
            code=$(curl --silent --show-error --location --max-time 30 --output /tmp/browser-tag.json \
              --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/kjlion/kpanel-browser/tags/$VERSION$suffix")
            test "$code" = 404 # Never overwrite an index or a partially published native image.
          done
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  l3:
    if: github.event_name == 'workflow_dispatch'
    needs: qualify
    uses: ./.github/workflows/release-l3.yml
    with:
      candidate: ${{ needs.qualify.outputs.candidate }}

  native:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CANDIDATE: ${{ needs.qualify.outputs.candidate }}
      VERSION: ${{ needs.qualify.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Build runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/browser/Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: kpanel-browser:check-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.CANDIDATE }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.arch }}
      - name: Build real-browser test runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/browser/Dockerfile
          target: test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: kpanel-browser:test
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
      - name: Qualify real sandbox and service
        run: sudo bash packaging/browser/verify.sh "kpanel-browser:check-$ARCH" kpanel-browser:test "$RUNNER_TEMP/browser-check-$ARCH"
      - name: Scan runtime vulnerabilities and configuration
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: bash scripts/security-scan.sh image "kpanel-browser:check-$ARCH"
      - name: Save the exact tested image
        run: |
          set -euo pipefail
          docker image inspect "kpanel-browser:check-$ARCH" > "$RUNNER_TEMP/image-$ARCH.json"
          docker save "kpanel-browser:check-$ARCH" | gzip -1 > "$RUNNER_TEMP/browser-$ARCH.tar.gz"
          sha256sum "$RUNNER_TEMP/browser-$ARCH.tar.gz" > "$RUNNER_TEMP/browser-$ARCH.tar.gz.sha256"
      - name: Make test evidence readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/browser-check-$ARCH" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/browser-check-$ARCH"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/browser-check-${{ matrix.arch }}/
            ${{ runner.temp }}/browser-${{ matrix.arch }}.tar.gz*
            ${{ runner.temp }}/image-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [qualify, l3, native]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE: ${{ needs.qualify.outputs.candidate }}
      VERSION: ${{ needs.qualify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          pattern: browser-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'kjlion' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested native images and immutable index
        run: |
          set -euo pipefail
          for suffix in '' -amd64 -arm64; do
            code=$(curl --silent --show-error --location --max-time 30 --output /tmp/browser-tag.json \
              --write-out '%{http_code}' "https://hub.docker.com/v2/repositories/kjlion/kpanel-browser/tags/$VERSION$suffix")
            test "$code" = 404
          done
          for arch in amd64 arm64; do
            directory="$RUNNER_TEMP/images/browser-$arch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "$(cut -d ' ' -f1 "$directory/browser-$arch.tar.gz.sha256")  $directory/browser-$arch.tar.gz" | sha256sum -c -
            docker load -i "$directory/browser-$arch.tar.gz"
            test "$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "kpanel-browser:check-$arch")" = "$CANDIDATE"
            test "$(docker inspect --format '{{.Architecture}}' "kpanel-browser:check-$arch")" = "$arch"
            docker tag "kpanel-browser:check-$arch" "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/public-index.txt"
          digest=$(awk '/^Digest:/ {print $2; exit}' "$RUNNER_TEMP/public-index.txt")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          echo "$IMAGE@$digest" > "$RUNNER_TEMP/browser-image.txt"
          echo "### Browser component" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/browser-image.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Replay publicly pulled amd64 image
        run: |
          set -euo pipefail
          docker build --target test -f packaging/browser/Dockerfile -t kpanel-browser:test .
          sudo bash packaging/browser/verify.sh "$(cat "$RUNNER_TEMP/browser-image.txt")" kpanel-browser:test "$RUNNER_TEMP/browser-public"
      - name: Make public evidence readable
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/browser-public" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/browser-public"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-index.txt
            ${{ runner.temp }}/browser-image.txt
            ${{ runner.temp }}/browser-public/
          if-no-files-found: error
