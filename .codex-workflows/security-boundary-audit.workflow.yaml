# KPanel Optional Security Boundary Audit

## Purpose

按 PROJECT_RULES.md 5.4 为独立候选分支提供有价值的安全线索。普通开发、集成、RC、稳定发布和补验
不必调用本 workflow，不自动追赶历史审计积压，不要求 Security-Audit trailer 或限期豁免。
产品 L0-L3、依赖漏洞扫描与已证实高风险漏洞响应继续按原标准执行。

## Prerequisites

- 只在明确选择辅助任务时读取固定 pin 的 Cloudflare security-audit-skill/SKILL.md 与必要阶段说明。
  上游更新只作候选，不自动升级 pin 或为维护工具启动产品审计。
  上游全量编排、自动续跑或强制完整报告若与项目 5.4 的选定范围/预算/停止条件冲突，以项目规则为准；
  因此省略必要步骤时只能标记 incomplete，不能宣称完成上游完整流程或覆盖。
- guidance 仅回答、不写文件、不编排子代理；scoped 选定单个功能或相关不变量；full 仅接受用户明确
  请求并在启动前确定预算。覆盖查询不是启动指令。
- scoped 默认预算引用 PROJECT_RULES.md 5.4；记录最大时间、调用数（含负责人）、并发和停止条件。
  没有独立资源直接 deferred，不能抢占产品发布资源或让发布等待。禁止自动续跑、补样本或扩大范围。
- scoped/full 的专用负责人及每个侦察、hunter、coverage critic、独立验证和记录核验子代理均显式
  使用 gpt-6-luna / max；不可用如实结束，不能静默替换。该配置不限制独立治理复核。
- project_dir 是干净的专用源码 worktree，只读目标；ledger_dir 是仓库外新目录。无 OS 沙箱
  （隔离网络、资源限额、scratch-only 写）禁止执行目标代码，动态能力不足保留 needs_validation。

## Steps

### 1. 冻结选定范围与预算

记录 source_ref/tree/clean、治理入口提交、上游 pin、选定路径/不变量、预期产物及停止条件。
开始/结束使用同一入口绑定源码身份：

```bash
node "${{governance_dir}}/scripts/security-audit-baseline.mjs" "${{project_dir}}" "${{baseline_ref}}"
```

身份改变时停止并保存现场，禁止 reset/stash 他人内容。仅加载与本批有关的历史证据，不要求扫完所有 run。
可选查询待审范围：

```bash
node "${{governance_dir}}/scripts/check-security-audit-coverage.mjs" --target "${{baseline_ref}}" --format=json
```

输出 participation=optional-candidate-only、blocking=false；scoped-recommended/full-recommended 和
14/30 天只帮助排序。查询出错记 unavailable，不形成产品阻断或“已审通过”。
任务范围由选定问题决定，不强制吞下 files/commits 全局积压。若声明提交覆盖，reviewed_commits 必须
覆盖每个 SHA 的全部边界文件及直接调用链；只审几个路径时不计该提交覆盖。

### 2. 聚焦侦察与猎取

按固定 skill 从当前源码建立范围内单元，相关旧账本仅作参考；范围外明确标记。
在预算内安排只读侦察、hunter 与独立 coverage critic，父任务是账本唯一写入者。
critic 发现的范围内缺口只在剩余预算内处理，超出则 deferred/incomplete；不能自动扩展到全仓。
正式 complete 仍要求冻结范围全部完成并独立核对，未完成批次不计覆盖。

### 3. 候选独立验证与报告

去重 fingerprint，优先验证能形成具体修复的已有线索。发现者与验证者必须不同；验证者尝试反驳，
confirmed 必须有完整源码追溯和独立记录核验，needs_validation 写明能力缺口。
无可验证线索可以结束；不能为形成分支制造漏洞、空提交或延长审计。
正式 findings/ledger 运行固定 skill 验证器（Linux/WSL O_NOFOLLOW 支持），只证明结构有效：

```bash
node "${{skill_dir}}/validate-findings.cjs" "${{ledger_dir}}/findings.json"
node "${{skill_dir}}/validate-coverage-ledger.cjs" "${{ledger_dir}}/coverage-ledger.json"
```

预算耗尽时只保存已有证据、真实终态与缺口，不为完成三份报告或记录返工无限续跑。
run-4 起沿用 scope_mode、run_status、精确 source_ref、source_dirty=false；scoped 含 comparison_base、
scope_complete。reviewed_commits 列表仅在本批完整核验后计覆盖，scope_complete=false；不完整批次
run_status=incomplete，不修改旧 verdict，不把停止、格式通过或发布完成当作覆盖通过。

### 4. 候选交付

保存真实起止、调用数、模型配置、范围和终态；tokens/金额未知写 null。不强制逐发布统计历史成本。
有价值线索按 PROJECT_RULES.md 5.4 转入正常候选修复任务，由独立源码分支完成验证、修复和回归。
记录 fingerprint、证据缺口、优先级、接手条件和后续修复身份；未验证线索不要求发布前补审或风险豁免。
已独立证实的紧急/高风险漏洞仍按产品质量标准处置。审计任务自身只读源码，不直接合并或发布修复。

共享入库是按需交付：先披露检查，再选择最小脱敏产物到 .governance/security-audit/run-<N>/。
入库时显式运行治理入口的元数据检查：

```bash
node "${{governance_dir}}/scripts/check-security-audit-coverage.mjs" --validate
```

校验失败只阻止这些审计产物被宣称有效，不阻断无关产品任务。含可复用攻击细节的原件在对应修复
公开前留在仓库外或不推送的本地分支。历史 run 与补审豁免保持原文，不承担现行门槛。

## Parameters

- project_dir / baseline_ref：精确干净源码 worktree 与提交。
- ledger_dir：仓库外新运行目录，不能覆盖原件。
- profile：guidance / scoped / full，选择与预算遵守 5.4。
- scope_paths：本批明确选择的路径与直接调用链；覆盖查询仅辅助选择。
- skill_dir：固定 pin 的上游 skills/security-audit 绝对路径。
- governance_dir：提供已提交基线/覆盖工具的治理工作树，旧源码可独立指定。

## Verification

核对源码身份、已声明范围、独立验证与真实终态；正式结构化产物执行上述验证器。
验证器通过不证明安全，未完成 run 不计覆盖；不需要为满足产品发布而完成此 workflow。

## Notes

不新增定时任务、常驻监控、全仓追赶或自动恢复。历史收益保持真实，缺数据不推断零成本/零风险。
工具代码回归可在治理测试中执行；普通 CI 不运行审计，也不无条件检查整个历史 run 注册表。
