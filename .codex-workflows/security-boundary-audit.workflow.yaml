# KPanel Security Blind Review

## Purpose

按 PROJECT_RULES.md 5.4 补齐 govulncheck / npm audit / Trivy 覆盖不到的逻辑漏洞：鉴权与限速、跨节点越权、
不可信导入越界、凭据脱敏、AI/MCP 工具边界和资源无界。一个包组一名复核者，几分钟完成；只有经实现者
逐条核实为紧急/高的漏洞按 docs/development-quality-standard.md 第 11 节阻止交付，其余分级记录。

## Prerequisites

- project_dir 是精确候选提交的 clean worktree；base_ref 是任务精确基线（candidate）或上一稳定 tag（review）。
- profile：candidate（写任务在候选提交后、预览与最终核验前自动执行）或 review（quality-audit 稳定版前补漏）。
- 复核者必须是不含实现上下文的新会话或子代理，任何提供商、任何具备代码阅读能力的模型均可；记录实际
  provider/model。实现者本人的上下文不能充当复核者。
- 未修复线索的攻击细节只保存在仓库外；提交、trailer 与公开文档只写计数和修复描述。

## Steps

### 1. 确定包组与审查单元

```bash
node scripts/security-review-scope.mjs --base "${{base_ref}}"
```

输出的 missing/stale 包组即本次 groups；recorded 不重复审。普通目录一个包组是一个审查单元；
`securityReview.fileLevelDirs` 中的大目录（`internal/panel`、`internal/cluster`）按文件分组，同一大目录下的
待审文件合成一个审查单元。candidate 档全部单元都审；review 档每次最多 6 个单元，按鉴权/凭据 >
跨节点/导入 > 其他排序，余下写入验收记录待下次。脚本报 not-applicable 时本 workflow 不适用，不写 trailer。

### 2. 导出盲审快照

不含 Git 历史：

- 普通目录：导出整个目录（不只是 diff）；目录少于约 300 行时，可把直接调用方所在目录一并导出；
- 大目录：只导出本单元的待审文件，加上它们直接调用的同目录文件。`internal/panel` 与回放基准的导出方式
  一致；`internal/cluster` 比基准 case-c（整目录导出）窄，这一差异尚未经基准验证。

导出了哪些文件写进核实记录。

```bash
snapshot="$(mktemp -d)/<unit-slug>"
mkdir -p "$snapshot"
git -C "${{project_dir}}" archive HEAD -- <路径...> PROJECT_RULES.md docs/development-quality-standard.md \
  | tar -x -C "$snapshot"
```

### 3. 盲审

把 `.governance/security-audit/review-prompt.md` 的「提示正文」原样交给复核者，只替换 `{{SNAPSHOT}}`。
不得附带实现说明、diff 解释、已知问题或期望结论。并发不超过 3 名复核者；单名复核者不设固定时长，
回放基准中每个 case 约 1–4 分钟。复核者中断时用同一会话续跑，不重新起一轮。复核者的最终报告原样保存到
仓库外证据目录，再开始第 4 步。

### 4. 逐条核实与处置

先去重：既有代码上、已记入仓库外安全待办的线索直接标 known，不重复核实。其余发现由实现者打开 file:line
追溯数据流，标记 confirmed / rejected（写一句理由）/ needs-validation：

- 落在本候选改动的文件或函数上、confirmed 紧急/高（第 11 节）：本候选内修复并补回归测试后才能交付；
- 落在本候选改动上、confirmed 中：本候选修复，或记录负责人、触发条件和期限后作为独立修复任务；
- confirmed 低与 needs-validation：进入待办，不阻断；
- 既有代码上的新发现：只核实新出现的紧急/高，其余记入待办。confirmed 紧急/高另起紧急修复任务，
  不阻止本候选，但按第 11 节阻止下一次发布；不混入本候选。

复核者给出的严重度只作参考，最终级别以实现者核实后的影响为准，判断依据写进修复提交或任务。
安全待办固定为仓库同级的 `_codex-evidence/security-backlog/backlog.md`（每条：首次发现日期、文件/函数、类别、
状态、处置任务），原始报告存同目录 `reviews/<日期>-<候选或 tag>/`；两者都不入库，攻击细节不进提交。

### 5. 留痕

在候选最后一个提交（或单独空提交）写 trailer：

```text
Security-Review: v1 scope=<group>[,<group>...] reviewer=<provider>/<model> findings=H<n>/M<n>/L<n> confirmed=<n> fixed=<n> deferred=<n>
```

scope 列出审过的包组；大目录必须逐个写文件路径（如 `scope=internal/panel/passkey.go,internal/panel/files.go`），
写目录不覆盖其中的文件。findings 是复核者原始分级计数，confirmed/fixed/deferred 是核实后结果。确实无需审查时写
`Security-Review: skipped scope=<group>[,<group>...] reason=<理由>`（例如只改注释、只增删
`internal/panel/server.go` 的路由注册），skip 只覆盖所列包组。trailer 只覆盖它所在提交及其祖先上的改动；
之后又改动同组代码需重审该组。`check-collaboration-state.mjs --require-candidate` 只提醒
`security_review=missing|stale`，不失败。

## Parameters

- project_dir：精确提交的 clean worktree。
- base_ref：candidate 档用任务精确基线；review 档用上一稳定 tag。
- profile：candidate 或 review。
- groups：步骤 1 输出的待审包组；review 档最多 6 个审查单元。

## Verification

- 每个 pending 组都有一名独立复核者的原始输出，且自由报告先于任何实现者解释落盘；
- 每条需核实的发现都有结论；本候选改动上的 confirmed 紧急/高已在候选内修复并有回归测试，
  既有代码上的已另起紧急修复任务；
- trailer 计数与核实记录一致，`security-review-scope.mjs` 对该范围输出 recorded。

## Notes

- 修改 review-prompt.md、默认做法或换用新的复核方式前，先按 `.governance/security-audit/README.md`
  在回放基准上盲跑，命中数不得低于基线；基准随新修复的真实漏洞增补。
- CF（cloudflare/security-audit-skill）不再是执行入口；历史 run、覆盖查询工具与固定 pin 保留只读，
  用户明确要求深度审计时才按其历史方法单独执行，结果同样走第 4 步核实。
- 不新增 CI 门禁、定时任务或全仓追赶；SAST 工具的评估结论与重评条件见 PROJECT_RULES.md 5.4。
