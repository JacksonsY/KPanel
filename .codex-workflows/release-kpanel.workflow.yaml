# Release KPanel

## Purpose

发布流程只使用 GitHub-hosted Actions，最终产物位于 GitHub Release 与 Docker Hub；不提供自有服务器、
SSH/WSL 灾备或生产部署方案。预览版禁止生产部署，不改变 GitHub Latest / Docker `latest`。
产品安装到用户宿主机是产品能力，不属于发布执行基础设施。

## Prerequisites

- 预检、有限重试和同身份证据复用遵守 `docs/project-management.md` 6.2.2 / 7.2。

- 已取得本次版本、精确范围的推送、main、tag、Release 和镜像发布授权；不自动部署生产。
- 读取 `PROJECT_RULES.md` 5.1/6.1、`docs/project-management.md` 10.1、10.2、13.1 和
  `docs/release-channels.md`。仅一个发布责任人、`release/vX.Y.Z-candidate` 列车与候选 worktree。
- `releaseChannel=${{release_channel}}`、`releaseTrain=${{release_train}}`；preview 只接受 X.Y.Z-rc.N，
  stable 只接受 X.Y.Z，不覆盖已占用版本。稳定版仍不附带生产部署。
- `dependency-policy.json#crossRepositoryReleaseLinkage` 确认 `scriptLinkageState`；
  `not-required` 表示无需发布脚本（不适用），保留兼容脚本基线 commit/摘要；coupled 先发布兼容脚本，
  否则 block-kpanel-candidate-or-remove-dependent-scope；script-only 不改变 KPanel 版本或产物。
- 仓库具有只用于发布 job 的 `DOCKERHUB_TOKEN`；镜像固定 `${{image}}`，默认 docker.io/kjlion/kejilion-panel。
- 本地开发、候选交付仍通过 SSH Git；GitHub 工作流内部用临时 Token，不引入长期仓库写凭据。
- 发布自动化本身已独立复核、同 SHA 候选 CI 后集成 main；dispatch 拒绝候选独有的工作流改动。

## Steps

### 1. 冻结候选

在 `${{project_dir}}` 核对 clean、精确批准基线、未知文件与唯一所有权：

```bash
node scripts/check-collaboration-state.mjs --role writer --base-ref <exact-base> --require-clean
git ls-remote origin refs/heads/main refs/heads/release/v${{release_train}}-candidate refs/tags/v${{version}}
```

同步 VERSION、Go/Web 版本与 CHANGELOG，按真实差异重新资格化供应链身份；按项目标准独立复核/OCR。
形成非空候选提交后运行 `--require-candidate`，仅推送到唯一候选分支并等待同 SHA push CI 成功。
本次功能旅程、证据与不适用范围冻结后，不纳入下一轮功能。

### 2. GitHub L3

`.github/workflows/release-l3.yml` 在迁移分支 push 资格化及发布 dispatch 内执行完整 L3；外层唯一入口：

```bash
node scripts/run-release-l3.mjs --github-hosted
```

该命令只能在 canonical GitHub-hosted Linux runner 上执行；内部复用 `scripts/run-release-gate.sh` /
`make verify-release`，保留源码三分组、安全、场景包、镜像、应用生命周期与 image E2E。
回执固定精确 candidate、Go/Node、GitHub runner image/version、run ID/attempt、入口摘要与终态。
artifacts 保存源码分组、原始日志和失败回执。旧本地 Runner ID、bundle、execute-kit 不再是执行方案。

### 3. 在 GitHub 发起预览

从仓库 main 的 Actions → **Publish preview** 输入 `${{candidate}}`，或：

```bash
gh workflow run preview-release.yml --repo kejilion/KPanel --ref main -f candidate=${{candidate}}
```

`.github/workflows/preview-release.yml` 校验精确候选分支、main 祖先、版本未占用及候选 push CI，
依次调用 CI、Release L3，再以 expected-SHA lease 原子快进 main/创建 annotated tag，显式调用主线 CI 和
可复用 `.github/workflows/release.yml`。不依赖 GITHUB_TOKEN 写入的 push 递归触发下一阶段。
候选漂移、分叉、权限失败、已占用 tag 均关闭失败；保留原 run，不盲目重发版本。

### 4. Release 与 Docker Hub

Release 复核 tag/源码/主线身份、版本与实际发布说明解析器；源码、安全和 native 镜像契约通过后，
创建 draft 与二进制/元数据附件，推送 amd64/arm64 OCI 镜像并生成 SBOM/provenance。
元数据附件命名为 `kejilion-panel-meta-${{version}}.tar.gz`，不是可构建源码包。
modified-component provenance 上传并验证后，最终说明门禁通过才提升 preview 并公开 prerelease。
stable tag 的 Release 先调用同一 L3；stable 分支收尾继续使用唯一 archive-release-candidate.mjs。
Release 公开失败或公开后验收失败分别报告，不得把已公开产物重建覆盖；恢复应复核现状并保留失败原件。

### 5. 公开产物与真实浏览器

发布 job 使用 `scripts/verify-github-public-release.mjs` 核对公开版本、annotated tag/source、两架构 OCI、
15 附件下载/API digest/磁盘回读、11 项 SHA256SUMS、Release 正文及 Latest/latest 不变。
`packaging/tests/release-browser/run.sh` 在 GitHub runner 上构建固定测试 Runner，记录实际 ID；
Playwright 包/lock 与浏览器 image 固定版本/digest。真实 Panel/Agent 容器覆盖本地应用、首选项/桌面恢复、
HTTPS/证书故障恢复、域名边界、PTY 续接/关闭、预览切换和真实更新弹窗；夹具库存/测试 CA 明确标注。
不挂载宿主 Docker/systemd socket 到被测 Panel/Agent，不声称隔离夹具等于生产安装/systemd 验证。
作业受 timeout/watchdog/容器资源限额约束；截图、JSON、日志与清理回执作为 Actions artifact 保存。

### 6. 收尾与回滚

记录候选 CI、L3、主线 CI、Release、公开产物各层事实，按 `docs/release-acceptance-template.md` 追加验收，
执行 `node scripts/report-release-metrics.mjs --validate-acceptance <file>`。未运行 CF 如实 not-run（可选）。
流程异常保留 fingerprint/次数/原日志，不以成功重试抹去失败。生产未部署写不适用。
按 project-management 10.2 保留 RC 列车，归档已完成治理候选；13.1 仅回收本任务拥有且已有恢复点的资源。
回滚保留 `${{previous_version}}` tag 与不可变 digest；退出 preview 不自动降级。

## Verification

- 对每个 run 核对精确候选 SHA、workflow、阶段、conclusion、attempt 与 artifact，不只看名称或绿色图标。
- candidate CI → L3 → main/tag → main CI → Release → Docker Hub → public/browser 必须都有真实成功回执。
- 任何必需阶段未完成不能宣称全链路调通；已公开与待验收状态分别报告。

## Rollback

Git 保留迁移前批准基线与上一版本；不删除版本 tag/Release，不覆盖不可变镜像。
CI 基础设施错误以聚焦后续提交修复；产品镜像问题使用下一 RC。稳定通道快照有差异时立即停止并核对。

## Notes

此文件是共享规范的执行适配，发布状态以 Git、GitHub run、公开 Release/registry 和验收原件为准。
