services:
  panel:
    image: ${KEJILION_PANEL_IMAGE:?Set KEJILION_PANEL_IMAGE to a versioned image}
    container_name: kejilion-panel
    restart: unless-stopped
    user: "65532:65532"
    group_add:
      - "${KEJILION_PANEL_GID:?Set KEJILION_PANEL_GID to the host kejilion-panel group id}"
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      KEJILION_PANEL_LISTEN: ":8080"
      KEJILION_PANEL_DATA_DIR: /var/lib/kejilion-panel
      KEJILION_PANEL_AGENT_SOCKET: /run/kejilion-panel/agent.sock
      KEJILION_PANEL_AGENT_TOKEN_FILE: /run/secrets/agent-token
      KEJILION_PANEL_WEB_ROOT: /app/web
      KEJILION_PANEL_PUBLIC_URL: ${KEJILION_PANEL_PUBLIC_URL:-}
      KEJILION_PANEL_SECURE_COOKIE: ${KEJILION_PANEL_SECURE_COOKIE:-true}
      KEJILION_PANEL_TRUSTED_PROXY_CIDRS: ${KEJILION_PANEL_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128,172.29.255.240/28}
      KEJILION_PANEL_CLUSTER_PRIVATE_CIDRS: ${KEJILION_PANEL_CLUSTER_PRIVATE_CIDRS:-}
      KEJILION_PANEL_BROWSER_SERVICE_URL: ${KEJILION_PANEL_BROWSER_SERVICE_URL:-http://browser:8092}
      KEJILION_PANEL_BROWSER_TOKEN_FILE: /run/kejilion-panel/browser/browser-token
    volumes:
      - ${KEJILION_PANEL_DATA_DIR_HOST:-/var/lib/kejilion-panel/panel}:/var/lib/kejilion-panel
      - /run/kejilion-panel:/run/kejilion-panel:ro
      - /etc/kejilion-panel/agent.token:/run/secrets/agent-token:ro
    networks:
      panel-internal:
        ipv4_address: ${KEJILION_PANEL_IPV4:?Set KEJILION_PANEL_IPV4 to the reserved private address}
      panel-egress: {}
      browser-control: {}
    healthcheck:
      test: ["CMD", "/paneld", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  panel-internal:
    name: kejilion-panel-internal
    internal: true
    ipam:
      config:
        - subnet: ${KEJILION_PANEL_NETWORK_SUBNET:-172.29.255.240/28}
          gateway: ${KEJILION_PANEL_GATEWAY:-172.29.255.241}
  panel-egress:
    name: kejilion-panel-egress
  browser-control:
    name: kejilion-panel-browser-control
    internal: true
